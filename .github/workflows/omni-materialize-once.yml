name: Omni Materialize Once

on:
  push:
    branches:
      - feat/omni-marketing-skill-packs

permissions:
  contents: write

jobs:
  materialize:
    if: github.repository == 'imMamdouhaboammar/marketing-council-pack' && !contains(github.event.head_commit.message, '[materialized-full-packs]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/omni-marketing-skill-packs
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render canonical full packs
        run: python scripts/render_skill_packs.py --write
      - name: Verify generated pack contracts
        run: |
          python scripts/render_skill_packs.py --check
          python scripts/validate_skill_packs.py
          python scripts/skill_bineval.py --json
          python scripts/evidence_ledger.py
      - name: Run complete regression suite
        run: python -m unittest discover -s tests -v
      - name: Validate source distribution
        run: python scripts/validate_distribution.py . --json
      - name: Build and validate host packages
        run: |
          rm -rf /tmp/marketing-council-hosts /tmp/marketing-council-submission /tmp/marketing-council-plugin-extracted
          python scripts/build_host_packages.py --output-root /tmp/marketing-council-hosts
          python scripts/build_openai_submission_pack.py --output-root /tmp/marketing-council-submission --json
          mkdir -p /tmp/marketing-council-plugin-extracted
          python - <<'PY'
          import json
          import pathlib
          import zipfile

          repo = pathlib.Path('.').resolve()
          version = json.loads((repo / '.codex-plugin' / 'plugin.json').read_text(encoding='utf-8'))['version']
          archive = pathlib.Path('/tmp/marketing-council-hosts') / f'marketing-council-openai-plugin-v{version}.zip'
          if not archive.is_file():
              raise SystemExit(f'missing current release archive: {archive}')
          out = pathlib.Path('/tmp/marketing-council-plugin-extracted')
          with zipfile.ZipFile(archive) as zf:
              zf.extractall(out)
          print(archive)
          PY
          python scripts/validate_openai_plugin.py /tmp/marketing-council-plugin-extracted --json
      - name: Commit only canonical generated Skill files
        shell: bash
        run: |
          if git diff --quiet -- skills; then
            echo 'No generated Skill drift to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add skills
          git diff --cached --quiet && exit 0
          git commit -m 'feat: materialize domain execution wiring in all full skill packs [materialized-full-packs]'
          git push origin HEAD:feat/omni-marketing-skill-packs
