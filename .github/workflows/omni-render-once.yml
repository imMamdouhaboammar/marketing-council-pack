name: Omni Render Once

on:
  push:
    branches:
      - feat/omni-marketing-skill-packs

permissions:
  contents: write

jobs:
  render:
    if: github.repository == 'imMamdouhaboammar/marketing-council-pack' && !contains(github.event.head_commit.message, '[rendered-full-packs]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/omni-marketing-skill-packs
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render canonical full packs
        run: python scripts/render_skill_packs.py --write
      - name: Validate rendered packs before mutation
        run: |
          python scripts/render_skill_packs.py --check
          python scripts/validate_skill_packs.py
          python scripts/skill_bineval.py --json
          python scripts/evidence_ledger.py
          python -m unittest tests.test_omni_skill_packs tests.test_skill_pack_tooling -v
      - name: Commit rendered packs
        shell: bash
        run: |
          if git diff --quiet -- skills; then
            echo 'No generated drift to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add skills
          git commit -m 'feat: materialize 29 full skill packs [rendered-full-packs]'
          git push origin HEAD:feat/omni-marketing-skill-packs
