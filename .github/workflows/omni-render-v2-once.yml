name: Omni Render V2 Once

on:
  push:
    branches:
      - feat/omni-marketing-skill-packs

permissions:
  contents: write

jobs:
  render:
    if: github.repository == 'imMamdouhaboammar/marketing-council-pack' && !contains(github.event.head_commit.message, '[rendered-full-packs-v2]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/omni-marketing-skill-packs
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render canonical full packs
        run: python scripts/render_skill_packs.py --write
      - name: Verify canonical full packs
        run: |
          python scripts/render_skill_packs.py --check
          python scripts/validate_skill_packs.py
          python scripts/skill_bineval.py --json
          python scripts/evidence_ledger.py
      - name: Run complete regression suite
        run: python -m unittest discover -s tests -v
      - name: Validate source distribution
        run: python scripts/validate_distribution.py . --json
      - name: Build and validate host packages
        run: |
          python scripts/build_host_packages.py --output-root /tmp/marketing-council-hosts
          python scripts/build_openai_submission_pack.py --output-root /tmp/marketing-council-openai --json
          python scripts/validate_openai_plugin.py /tmp/marketing-council-hosts/marketing-council-openai-plugin-v1.4.0.zip --json
      - name: Commit only rendered Skill files
        shell: bash
        run: |
          if git diff --quiet -- skills; then
            echo 'No generated Skill drift to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add skills
          git commit -m 'fix: preserve execution links in full skill packs [rendered-full-packs-v2]'
          git push origin HEAD:feat/omni-marketing-skill-packs
