name: Plugin CI

on:
  push:
    branches:
      - fix/chatgpt-plugin-discovery-routing
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Plugin discovery regression tests
        run: python -m unittest tests.test_plugin_discovery -v

      - name: Dynamic router regression tests
        run: python -m unittest tests.test_skill_router -v

      - name: Run full unit test suite
        run: python -m unittest discover -s tests -v

      - name: Validate source distribution
        run: python scripts/validate_distribution.py . --json

      - name: Build host packages
        run: python scripts/build_host_packages.py --output-root /tmp/marketing-council-dist

      - name: Validate OpenAI plugin package
        run: |
          mkdir -p /tmp/marketing-council-openai
          python - <<'PY'
          import pathlib, zipfile
          root = pathlib.Path('/tmp/marketing-council-dist')
          archive = next(root.glob('marketing-council-openai-plugin-v*.zip'))
          out = pathlib.Path('/tmp/marketing-council-openai')
          with zipfile.ZipFile(archive) as zf:
              zf.extractall(out)
          print(archive)
          PY
          python scripts/validate_openai_plugin.py /tmp/marketing-council-openai --json
