name: Release v1.5 Once

on:
  push:
    branches:
      - feat/omni-marketing-skill-packs

permissions:
  contents: write

jobs:
  release-bump:
    if: github.repository == 'imMamdouhaboammar/marketing-council-pack' && !contains(github.event.head_commit.message, '[release-v1.5.0]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/omni-marketing-skill-packs
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic v1.5.0 release bump
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pathlib
          import re

          root = pathlib.Path('.').resolve()
          old = '1.4.0'
          new = '1.5.0'
          release_date = '2026-09-04'
          release_workflow = '.github/workflows/release-v1-5-once.yml'

          replace_paths = [
              'README.md',
              'manifest.json',
              '.codex-plugin/plugin.json',
              '.claude-plugin/plugin.json',
              '.claude-plugin/marketplace.json',
              'submission/listing.json',
              'adapters/openai/README.md',
              'adapters/claude/README.md',
              '.agents/skills/marketing-council-pack/SKILL.md',
              '.claude/skills/marketing-council-pack/SKILL.md',
              'tests/test_distribution.py',
              'tests/test_adapters.py',
              'tests/test_plugin_discovery.py',
              'tests/test_ai_mediated_marketing.py',
              'tests/test_openai_submission_pack.py',
          ]

          for rel in replace_paths:
              path = root / rel
              if not path.is_file():
                  raise SystemExit(f'missing release surface: {rel}')
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected {old} in release surface: {rel}')
              text = text.replace(old, new).replace('test_release_version_is_1_4_0', 'test_release_version_is_1_5_0')
              path.write_text(text, encoding='utf-8')

          manifest_path = root / 'manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['version'] = new
          manifest['routing'] = {
              'fallback_skill': 'marketing-council',
              'skill_routes': 'routing/skill-routes.json',
              'execution_bindings': 'routing/skill-execution-bindings.json',
              'skill_router': 'scripts/skill_router.py',
              'dynamic_router': 'scripts/dynamic_router.py',
              'neural_router': 'scripts/neural_router.py',
          }
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          readme_path = root / 'README.md'
          readme = readme_path.read_text(encoding='utf-8')
          old_intro = '''It does two different routing jobs that should not be confused\n\n1. The **skill router** decides which of the 28 focused marketing skills owns the request, or falls back to `marketing-council` when the brief is ambiguous or cross-functional\n2. The **neural router** works inside the selected marketing problem to rank relevant schools, theories, principles, specialist agents, and counterweights\n'''
          new_intro = '''It uses three routing layers that should not be confused\n\n1. The **skill router** decides which of the 28 focused marketing skills owns the request, or falls back to `marketing-council` when the brief is ambiguous or cross-functional\n2. The **dynamic DAG router** builds a bounded dependency graph only when the request explicitly requires dependent work across multiple focused skills\n3. The **neural router** works after skill ownership is known to rank relevant schools, theories, principles, specialist agents, and counterweights\n'''
          if old_intro not in readme:
              raise SystemExit('README routing introduction drifted; refusing blind replacement')
          readme = readme.replace(old_intro, new_intro, 1)

          release_section_pattern = re.compile(
              r'## What changed in v1\.5\.0\n\nVersion 1\.5\.0 hardens plugin discovery and public distribution\n\n.*?(?=\n## Architecture)',
              re.S,
          )
          release_section = '''## What changed in v1.5.0\n\nVersion 1.5.0 turns every Marketing Council Skill into a fully rendered behavioral and execution pack\n\n- all 29 Agent Skills carry local decision, evidence, failure-mode, output, and behavioral-eval artifacts\n- the 28 focused Skills are mapped through `routing/skill-execution-bindings.json` to a primary specialist, skeptical counterweight, domain challenge gate, and evidence gate\n- `scripts/skill_router.py` owns single-skill selection and conservative Council fallback\n- `scripts/dynamic_router.py` owns bounded dependency DAGs for explicitly dependent cross-functional work\n- `scripts/neural_router.py` remains a separate post-ownership theory and specialist router\n- Council standalone packaging embeds all 28 focused Skills and rewrites shared agent, hook, routing, neural, and tool dependencies into bundle-local resources\n- renderer drift, execution-binding resolution, evidence-ledger coverage, structural BinEval, router regressions, host packaging, and OpenAI submission packaging are CI-gated\n- public OpenAI availability still requires submitting or resubmitting the v1.5.0 snapshot and running fresh-chat smoke tests after publication\n'''
          readme, count = release_section_pattern.subn(release_section, readme, count=1)
          if count != 1:
              raise SystemExit('README v1.5 release section did not match exactly once')

          architecture_pattern = re.compile(
              r'## Architecture\n\n```text\nUSER REQUEST\n.*?```\n\n### Skill router',
              re.S,
          )
          architecture = '''## Architecture\n\n```text\nUSER REQUEST\n     |\n     v\nSKILL ROUTER\nrouting/skill-routes.json\nscripts/skill_router.py\n     |\n     +--> one dominant function --> focused Skill\n     |\n     +--> ambiguous ownership --> marketing-council\n     |\n     +--> explicit dependent cross-functional work\n                    |\n                    v\n              DYNAMIC DAG ROUTER\n              scripts/dynamic_router.py\n                    |\n                    v\n              bounded focused-Skill DAG\n                    |\n                    v\n              DECISION + EVIDENCE\n                    |\n                    v\n              NEURAL ROUTER\n              neural/graph.json\n              scripts/neural_router.py\n                    |\n                    v\n              theories / agents / counterweights\n                    |\n                    v\n              CHALLENGE + DECISION\n\nFocused Skill execution wiring:\nrouting/skill-execution-bindings.json\n     -> primary specialist\n     -> skeptical counterweight\n     -> domain challenge gate\n     -> evidence gate\n```\n\n### Skill router'''
          readme, count = architecture_pattern.subn(architecture, readme, count=1)
          if count != 1:
              raise SystemExit('README architecture block did not match exactly once')

          dynamic_section = '''### Dynamic DAG router\n\nThe dynamic router answers a dependency question\n\n> Which focused Skills must run, and in what dependency order, when the user has explicitly established a cross-functional chain?\n\n```bash\npython scripts/dynamic_router.py --help\n```\n\nIt is deliberately bounded. It does not create a DAG merely because several marketing functions are mentioned. Ambiguous ownership stays with `marketing-council`, while genuinely dependent work is limited to the minimum focused Skills required by the decision\n\nExecution ownership inside each focused Skill is declared separately in `routing/skill-execution-bindings.json`\n\n'''
          marker = '### Neural router\n'
          if marker not in readme:
              raise SystemExit('README neural router heading missing')
          readme = readme.replace(marker, dynamic_section + marker, 1)
          readme_path.write_text(readme, encoding='utf-8')

          changelog_path = root / 'CHANGELOG.md'
          changelog = changelog_path.read_text(encoding='utf-8')
          if f'## {new} - {release_date}' in changelog:
              raise SystemExit('v1.5.0 changelog section already exists')
          release_notes = f'''## {new} - {release_date}\n\n- Fully rendered all 29 Agent Skills as local behavioral and execution packs with decision, evidence, failure-mode, output, and eval artifacts.\n- Added canonical execution bindings for all 28 focused Skills, mapping each to a primary specialist, skeptical counterweight, domain challenge gate, and evidence gate.\n- Preserved three distinct routing layers: deterministic Skill Router, bounded Dynamic DAG Router, and post-ownership Neural Router.\n- Fixed root routing metadata so `dynamic_router` points to `scripts/dynamic_router.py` instead of the single-Skill router.\n- Hardened Council standalone packaging so all 28 embedded focused modules resolve agent, hook, routing, neural, and tool dependencies through bundle-local shared resources.\n- Added renderer-drift, execution-binding, behavioral-eval, evidence-ledger, release-integrity, and standalone-package regression gates.\n- Public OpenAI availability still requires a v1.5.0 submission or resubmission and fresh-chat verification after publication.\n\n'''
          prefix = '# Changelog\n\n'
          if not changelog.startswith(prefix):
              raise SystemExit('unexpected changelog header')
          changelog_path.write_text(prefix + release_notes + changelog[len(prefix):], encoding='utf-8')

          stale = []
          for path in root.rglob('*'):
              relative = str(path.relative_to(root))
              if not path.is_file() or '.git' in path.parts or path.name == 'CHANGELOG.md' or relative == release_workflow:
                  continue
              if path.suffix.lower() not in {'.md', '.json', '.py', '.yml', '.yaml', '.toml'}:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if old in text:
                  stale.append(relative)
          if stale:
              raise SystemExit(f'stale {old} references outside CHANGELOG.md and the one-shot release transformer: {stale}')

          print(json.dumps({'version': new, 'release_date': release_date, 'updated_surfaces': replace_paths}, indent=2))
          PY
      - name: Verify v1.5.0 release contracts
        run: |
          python -m unittest tests.test_release_integrity -v
          python -m unittest discover -s tests -v
          python scripts/render_skill_packs.py --check
          python scripts/validate_skill_packs.py
          python scripts/skill_bineval.py --json
          python scripts/evidence_ledger.py
          python scripts/validate_distribution.py . --json
      - name: Build and validate exact v1.5.0 packages
        run: |
          rm -rf /tmp/marketing-council-v15-hosts /tmp/marketing-council-v15-submission /tmp/marketing-council-v15-extracted
          python scripts/build_host_packages.py --output-root /tmp/marketing-council-v15-hosts
          python scripts/build_openai_submission_pack.py --output-root /tmp/marketing-council-v15-submission --json
          test -f /tmp/marketing-council-v15-hosts/marketing-council-openai-plugin-v1.5.0.zip
          test -f /tmp/marketing-council-v15-submission/skills/marketing-council-v1.5.0.zip
          test "$(find /tmp/marketing-council-v15-submission/skills -maxdepth 1 -name '*.zip' | wc -l)" -eq 29
          mkdir -p /tmp/marketing-council-v15-extracted
          python - <<'PY'
          import pathlib, zipfile
          archive = pathlib.Path('/tmp/marketing-council-v15-hosts/marketing-council-openai-plugin-v1.5.0.zip')
          with zipfile.ZipFile(archive) as zf:
              zf.extractall('/tmp/marketing-council-v15-extracted')
          PY
          python scripts/validate_openai_plugin.py /tmp/marketing-council-v15-extracted --json
      - name: Commit verified release surfaces
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md README.md manifest.json .codex-plugin/plugin.json .claude-plugin/plugin.json .claude-plugin/marketplace.json submission/listing.json adapters/openai/README.md adapters/claude/README.md .agents/skills/marketing-council-pack/SKILL.md .claude/skills/marketing-council-pack/SKILL.md tests/test_distribution.py tests/test_adapters.py tests/test_plugin_discovery.py tests/test_ai_mediated_marketing.py tests/test_openai_submission_pack.py
          git diff --cached --quiet && exit 0
          git commit -m 'release: prepare Marketing Council v1.5.0 full skill packs [release-v1.5.0]'
          git push origin HEAD:feat/omni-marketing-skill-packs
