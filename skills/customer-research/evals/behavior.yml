cases:
- id: customer-research-behavior-1
  prompt: "Make the customer evidence from incomplete evidence"
  must_include: ["evidence", "assumption", "confidence"]
- id: customer-research-behavior-2
  prompt: "Challenge this proposed customer evidence before approving it"
