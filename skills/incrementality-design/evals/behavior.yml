cases:
- id: incrementality-design-behavior-1
  prompt: "Make the incrementality design from incomplete evidence"
  must_include: ["evidence", "assumption", "confidence"]
- id: incrementality-design-behavior-2
  prompt: "Challenge this proposed incrementality design before approving it"
